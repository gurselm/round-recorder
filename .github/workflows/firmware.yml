# Tests and builds on every push and pull request. A tag such as v1.0.0 also
# makes a GitHub release with the firmware and puts the web installer (web/)
# on GitHub Pages with that firmware.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Host tests
        run: python3 -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          command: idf.py build && idf.py merge-bin -o round-recorder-full.bin
      - name: Collect
        run: |
          mkdir -p out
          cp "$(find build -name round-recorder-full.bin | head -1)" out/round-recorder.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: out/round-recorder.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
      - name: Name it by version
        run: cp round-recorder.bin "round-recorder-${GITHUB_REF_NAME}.bin"
      - uses: softprops/action-gh-release@v3
        with:
          files: round-recorder-${{ github.ref_name }}.bin
          generate_release_notes: true

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: web
      - name: Stamp the version
        run: |
          sed -i "s/\"version\": \"dev\"/\"version\": \"${GITHUB_REF_NAME#v}\"/" web/manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
